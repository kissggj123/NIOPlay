<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Apple CarPlay</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIO Play">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZmY1ZjZkIi8+PHN0b3Agb2Zmc2V0PSIuMzUiIHN0b3AtY29sb3I9IiNmZmIyNmIiLz48c3RvcCBvZmZzZXQ9Ii42NSIgc3RvcC1jb2xvcj0iIzZiZDQ3ZiIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzRmYzNmNyIvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSJ1cmwoI2cpIi8+PHBhdGggZD0iTTI2IDIwbDE4IDEyLTE4IDEyeiIgZmlsbD0iI2ZmZiIvPjwvc3ZnPg==">
<style>
  :root{
    --rb:linear-gradient(135deg,#ff5f6d,#ffb26b,#ffe66b,#6bd47f,#4fc3f7,#b06bf5);
    --bg:#f5f6f8; --card:#ffffff; --txt:#1a1a1a; --txt2:rgba(0,0,0,.45);
    --line:rgba(0,0,0,.08); --track:#e9e9ee; --glass:rgba(255,255,255,.92);
    --panel:rgba(255,255,255,.94); --btnline:rgba(255,255,255,.4);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101013; --card:#1d1d22; --txt:#f2f2f5; --txt2:rgba(255,255,255,.45);
      --line:rgba(255,255,255,.1); --track:#2b2b31; --glass:rgba(30,30,36,.88);
      --panel:rgba(28,28,33,.94); --btnline:rgba(255,255,255,.14); }
  }
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #v{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;
    touch-action:none;cursor:pointer;display:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;
    touch-action:none;cursor:pointer;display:none}
  #rv{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;
    touch-action:none;cursor:pointer;display:none}
  /* generic color transition (night mode follows system, 200ms) */
  body,#waiting,#hud,.rowselect,.micbtn,.ghostbtn,.lbl,.val,.tab,.seg button{
    transition:background-color .2s ease,color .2s ease,border-color .2s ease}
  /* waiting page: light background + two-tone rainbow spinner */
  #waiting{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:var(--bg);font-family:-apple-system,sans-serif;
    text-align:center;padding:24px}
  .spinner{width:46px;height:46px;border-radius:50%;
    border:4px solid var(--track);border-top-color:#b06bf5;border-right-color:#4fc3f7;
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .w-main{font-size:16px;font-weight:600;color:var(--txt)}
  .w-sub{font-size:13px;color:var(--txt2);line-height:1.6}
  /* disconnect page: engine stopped — replaces the frozen last frame */
  #dcpage{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:var(--bg);font-family:-apple-system,sans-serif;
    text-align:center;padding:24px}
  /* HUD: light glass + dark monospace */
  #hud{position:fixed;top:10px;left:10px;z-index:10;background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    color:var(--txt);border:1px solid var(--line);border-radius:10px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:7px 10px;line-height:1.5;
    display:none;pointer-events:none;white-space:pre;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  /* setHud() flips display:block at page load before stats exist — never
     render the empty pill (needs !important to beat the inline style) */
  #hud:empty{display:none!important}
  /* hint bar */
  #hint{position:fixed;left:0;right:0;bottom:0;text-align:center;color:rgba(255,255,255,.5);
    font-family:-apple-system,sans-serif;font-size:12px;padding:12px;pointer-events:none;
    transition:opacity .6s ease}
  #hint.fade{opacity:0}
  /* round 40px control buttons */
  .cbtn{position:fixed;z-index:10;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--btnline);background:var(--glass);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    color:var(--txt);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 12px rgba(0,0,0,.18);cursor:pointer;padding:0;
    transition:transform .12s ease,background-color .2s ease,color .2s ease}
  .cbtn:active{transform:scale(.92)}
  .cbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  #mutebtn{top:10px;right:10px}
  #focusbtn{top:10px;right:64px}
  #panelbtn{top:10px;right:118px}
  #fsbtn{top:10px;right:172px}
  #reloadbtn{top:10px;right:226px}
  #fsbtn.active,#panelbtn.active,#focusbtn.active{background-image:var(--rb);color:#fff;border-color:transparent}
  /* CSS immersive fallback when the Fullscreen API is unavailable/refused */
  body.cssfs #hint{display:none}
  #mutebtn .ic-muted{display:none}
  #mutebtn.muted .ic-on{display:none}
  #mutebtn.muted .ic-muted{display:inline}
  #focusbtn .ic-off{display:none}
  #focusbtn.active .ic-on{display:none}
  #focusbtn.active .ic-off{display:inline}
  /* disconnect banner (below panel z-index, top-center) */
  #banner{position:fixed;top:12px;left:50%;z-index:15;transform:translateX(-50%) translateY(-10px);
    background:#fff3e0;border:1px solid #ffcf99;color:#8a5300;border-radius:999px;
    font-family:-apple-system,sans-serif;font-size:13px;padding:8px 16px;
    display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;
    box-shadow:0 4px 16px rgba(255,149,0,.25);
    transition:opacity .3s ease,transform .3s ease}
  #banner.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #banner .bdot{width:8px;height:8px;border-radius:50%;background:#ff9500;
    animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  /* result toast (same pill family as banner, green = success) */
  #toast{position:fixed;top:12px;left:50%;z-index:15;transform:translateX(-50%) translateY(-10px);
    background:#e8f5e9;border:1px solid #a5d6a7;color:#1b5e20;border-radius:999px;
    font-family:-apple-system,sans-serif;font-size:13px;padding:8px 16px;
    opacity:0;pointer-events:none;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 4px 16px rgba(76,175,80,.25);
    transition:opacity .3s ease,transform .3s ease}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* focus mode: hide all chrome */
  body.focus #hud,body.focus #hint,body.focus .cbtn,body.focus #panel,
  body.focus #banner,body.focus #toast{display:none!important}
  /* focus recovery hint must stay visible during its 2.8s window */
  body.focus #toast.show{display:flex!important}
  /* settings panel: white glass, 150ms open/close */
  #panel{position:fixed;top:60px;right:10px;z-index:20;width:272px;max-height:80vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    color:var(--txt);border:1px solid var(--line);border-radius:16px;
    font-family:-apple-system,sans-serif;font-size:13px;padding:14px;
    box-shadow:0 8px 32px rgba(0,0,0,.2);
    opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none;visibility:hidden;
    transition:opacity .15s ease,transform .15s ease,visibility .15s}
  #panel.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
  .tabs{display:flex;background:var(--track);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
  .tab{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 0 6px;
    font-size:13px;color:var(--txt2);cursor:pointer;position:relative;font-family:inherit}
  .tab.active{background:var(--card);color:var(--txt);font-weight:600;
    box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .tab.active::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:14px;height:3px;border-radius:2px;background:var(--rb)}
  .row{display:flex;align-items:center;gap:8px;margin:10px 0}
  .lbl{flex:0 0 50px;font-size:12px;color:var(--txt2)}
  .val{flex:0 0 34px;text-align:right;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;color:var(--txt2)}
  .rowselect{flex:1;min-width:0;-webkit-appearance:none;appearance:none;
    background-color:var(--track);color:var(--txt);border:none;border-radius:10px;
    padding:10px 28px 10px 12px;font-size:13px;font-family:inherit;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 5l7 7-7 7'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:26px;
    border-radius:13px;outline:none;border:none;padding:0;margin:0;background:var(--track)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    border-radius:50%;background:#fff;border:none;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .seg{flex:1;display:flex;background:var(--track);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:8px 0;
    font-size:12px;color:var(--txt2);cursor:pointer;font-family:inherit}
  .seg button.active{background:var(--card);color:var(--txt);font-weight:600;
    box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .primarybtn{display:block;width:100%;background-image:var(--rb);color:#fff;border:none;
    border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;margin:12px 0 4px}
  .primarybtn:active{opacity:.85}
  .ghostbtn{display:block;width:100%;background:transparent;color:var(--txt);
    border:1px solid var(--line);border-radius:12px;padding:11px;font-size:13px;
    cursor:pointer;font-family:inherit;margin:10px 0 2px}
  .ghostbtn:active{background:var(--track)}
  .micbtn{display:block;width:100%;background:var(--card);color:var(--txt);
    border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;
    font-weight:600;cursor:pointer;font-family:inherit;margin:4px 0}
  .micbtn.on{background:#ff3b30;color:#fff;border-color:transparent}
  .sect{font-size:11px;font-weight:600;color:var(--txt2);margin:16px 0 2px;letter-spacing:.5px}
  .note{font-size:11px;color:var(--txt2);line-height:1.5;margin:6px 0 0}
</style>
</head>
<body>
<div id="waiting">
  <div class="spinner"></div>
  <div class="w-main">正在连接 CarPlay…</div>
  <div class="w-sub">请确认 Mac 上的 NIO Play 已连接 iPhone</div>
</div>
<div id="dcpage">
  <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#ff9500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
  <div class="w-main">已断开</div>
  <div class="w-sub">接收端已停止 · 重新启动后将自动重连</div>
</div>
<img id="v" alt="" draggable="false">
<canvas id="c"></canvas>
<video id="rv" autoplay playsinline muted></video>
<div id="hud"></div>
<div id="banner"><span class="bdot"></span><span id="btxt">连接已断开 · 重连中</span></div>
<div id="toast"><span id="ttxt"></span></div>
<div id="hint">触摸屏幕操作 CarPlay · 双击呼出/隐藏控制</div>
<button id="mutebtn" class="cbtn" title="静音/取消静音">
  <svg class="ic-on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
  <svg class="ic-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9l6 6"/><path d="M22 9l-6 6"/></svg>
</button>
<button id="focusbtn" class="cbtn" title="专注模式">
  <svg class="ic-on" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
<button id="fsbtn" class="cbtn" title="全屏">
  <svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
</button>
<button id="reloadbtn" class="cbtn" title="强制刷新（清缓存重载）">
  <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
</button>
<button id="panelbtn" class="cbtn" title="设置">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<div id="panel">
  <div class="tabs">
    <button type="button" class="tab active" data-pg="pg-display">显示</button>
    <button type="button" class="tab" data-pg="pg-audio">音频</button>
    <button type="button" class="tab" data-pg="pg-mic">麦克风</button>
  </div>

  <div class="pg" id="pg-display">
    <div class="row"><span class="lbl">分辨率</span>
      <select id="res" class="rowselect">
        <option value="800x480">800×480</option>
        <option value="1280x720" selected>1280×720</option>
        <option value="1920x720">1920×720</option>
        <option value="1920x1080">1920×1080</option>
        <option value="2560x1440">2560×1440</option>
      </select>
    </div>
    <div class="row"><span class="lbl">帧率</span>
      <div class="seg" id="fpsseg">
        <button type="button" data-v="30">30 fps</button>
        <button type="button" data-v="60" class="active">60 fps</button>
      </div>
    </div>
    <div class="row"><span class="lbl">编码</span>
      <select id="codec" class="rowselect"><option value="h264" selected>H.264</option><option value="hevc">H.265/HEVC</option></select>
    </div>
    <div class="row"><span class="lbl">状态浮层</span>
      <div class="seg" id="hudseg">
        <button type="button" data-v="on">显示</button>
        <button type="button" data-v="off">隐藏</button>
      </div>
    </div>
    <div class="row"><span class="lbl">缩放模式</span>
      <div class="seg" id="fitseg">
        <button type="button" data-v="fit" class="active">适应</button>
        <button type="button" data-v="fill">填充</button>
      </div>
    </div>
    <div class="row"><span class="lbl">UI 缩放</span>
      <select id="uiscale" class="rowselect"><option value="75">小 75%</option><option value="85">较小 85%</option>
      <option value="100" selected>默认 100%</option><option value="115">大 115%</option></select>
    </div>
    <div class="row"><span class="lbl">屏幕物理宽度</span>
      <select id="mmsel" class="rowselect"></select>
    </div>
    <div class="hint" id="mmhint" style="display:none">已保存，重新启动接收后生效</div>
    <button type="button" id="matchwin" class="ghostbtn">匹配本窗口像素</button>
    <button type="button" id="applydisplay" class="primarybtn">应用显示设置</button>
    <div class="sect">安全边距</div>
    <div class="row"><span class="lbl">上</span><input type="range" id="margin-top" min="0" max="40" value="0"><span class="val" id="margin-top-v">0%</span></div>
    <div class="row"><span class="lbl">下</span><input type="range" id="margin-bottom" min="0" max="40" value="0"><span class="val" id="margin-bottom-v">0%</span></div>
    <div class="row"><span class="lbl">左</span><input type="range" id="margin-left" min="0" max="40" value="0"><span class="val" id="margin-left-v">0%</span></div>
    <div class="row"><span class="lbl">右</span><input type="range" id="margin-right" min="0" max="40" value="0"><span class="val" id="margin-right-v">0%</span></div>
    <div class="note">避开刘海/系统栏遮挡，0-40%</div>
  </div>

  <div class="pg" id="pg-audio" hidden>
    <div class="row"><span class="lbl">总音量</span><input type="range" id="vol-master" min="0" max="100" value="100"><span class="val" id="vol-master-v">100</span></div>
    <div class="row"><span class="lbl">媒体</span><input type="range" id="vol-media" min="0" max="100" value="100"><span class="val" id="vol-media-v">100</span></div>
    <div class="row"><span class="lbl">导航</span><input type="range" id="vol-nav" min="0" max="100" value="100"><span class="val" id="vol-nav-v">100</span></div>
    <div class="row"><span class="lbl">通话/Siri</span><input type="range" id="vol-call" min="0" max="100" value="100"><span class="val" id="vol-call-v">100</span></div>
  </div>

  <div class="pg" id="pg-mic" hidden>
    <button type="button" id="micbtn" class="micbtn">启用麦克风</button>
    <div class="note">Siri/通话时将浏览器麦克风送回 iPhone</div>
  </div>
</div>

<script>
(function(){
  var img=document.getElementById('v'),
      waiting=document.getElementById('waiting'),
      hint=document.getElementById('hint'),
      mutebtn=document.getElementById('mutebtn'),
      focusbtn=document.getElementById('focusbtn'),
      panelbtn=document.getElementById('panelbtn'),
      panel=document.getElementById('panel'),
      banner=document.getElementById('banner'),
      toast=document.getElementById('toast'),
      ttxt=document.getElementById('ttxt'),
      ws=null, wsReady=false,
      active=new Map(),
      imgShown=false, muted=false,
      toastTimer=null;

  /* transient toast (pill style, same family as #banner) */
  function showToast(msg){
    if(!toast) return;
    ttxt.textContent=msg;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toast.classList.remove('show'); },2800);
  }

  /* ============ video (WebCodecs H.264 passthrough) ============ */
  var useWebCodecs = window.isSecureContext && ('VideoDecoder' in window);
  // Fork (screen capture): if the server is in screencap mode, force MJPEG
  // even in a secure context (there's no H.264 stream to decode).
  var health=null;
  try {
    var healthXhr = new XMLHttpRequest();
    healthXhr.open('GET', '/health', false); // synchronous, runs once at load
    healthXhr.send();
    if (healthXhr.status === 200) {
      health = JSON.parse(healthXhr.responseText);
      if (health.mode === 'screencap') useWebCodecs = false;
    }
  } catch (e) { /* ignore, fall back to default */ }
  // Fork: preselect the streaming codec in the settings panel so "应用显示设置"
  // resends what's in use unless the user changes it.
  try {

  function updateHud(mode, extra){
    if(hudHidden) return;
    hud.style.display='block';
    var now=Date.now(), dt=(now-lastStatTime)/1000;
    var fps=dt>0?(frameCount/dt).toFixed(1):'0';
    var kbps=dt>0?((bytesCount*8/dt)/1000).toFixed(0):'0';
    var stats='';
    if(droppedFrames>0) stats+='  丢帧'+droppedFrames;
    if(rttMs!==null) stats+='  '+rttMs+'ms';
    if(audioUnderruns>0) stats+='  欠载'+audioUnderruns;
    if(audioOverflows>0) stats+='  溢出'+audioOverflows;
    if(missingFrames>0) stats+='  缺帧'+missingFrames;
    if(audioSplices>0) stats+='  接缝'+audioSplices;
    if(audioCtx) stats+='  ctx'+Math.round(audioCtx.sampleRate/100)/10+'k';
    // Fork: window physical pixels — the head unit's true panel size the stream
    // should be negotiated to match (black-bar diagnosis: stream aspect vs win).
    var dpr=window.devicePixelRatio||1;
    stats+='  窗口'+Math.round(window.innerWidth*dpr)+'×'+Math.round(window.innerHeight*dpr);
    hud.textContent=mode+'\n'+fps+' fps  '+kbps+' kbps'+stats+(extra?'\n'+extra:'');
    if(dt>=1){ frameCount=0; bytesCount=0; lastStatTime=now; }
  }

  function parseNalUnits(data){
    var units=[], i=0, n=data.length;
    while(i<n-3){
      var scLen=0;
      if(data[i]===0&&data[i+1]===0){
        if(data[i+2]===1) scLen=3;
        else if(i+3<n&&data[i+2]===0&&data[i+3]===1) scLen=4;
      }
      if(!scLen){ i++; continue; }
      var start=i+scLen, j=start, found=false;
      while(j<n-3){
        if(data[j]===0&&data[j+1]===0&&
           (data[j+2]===1||(j+3<n&&data[j+2]===0&&data[j+3]===1))) { found=true; break; }
        j++;
      }
      // Fork: if no next start code found, the NAL runs to the end of data
      if(!found) j=n;
      if(j>start) units.push(data.subarray(start,j));
      i=j;
    }
    return units;
  }

  function buildAvcC(sps, pps){
    var len=7+2+sps.length+1+2+pps.length;
    var out=new Uint8Array(len), o=0;
    out[o++]=1; out[o++]=sps[1]; out[o++]=sps[2]; out[o++]=sps[3];
    out[o++]=0xFF; out[o++]=0xE1;
    out[o++]=(sps.length>>8)&0xFF; out[o++]=sps.length&0xFF;
    out.set(sps,o); o+=sps.length;
    out[o++]=1;
    out[o++]=(pps.length>>8)&0xFF; out[o++]=pps.length&0xFF;
    out.set(pps,o);
    return out;
  }

  function codecStringFromSps(sps){
    function hx(b){ return ('0'+b.toString(16)).slice(-2).toUpperCase(); }
    return 'avc1.'+hx(sps[1])+hx(sps[2])+hx(sps[3]);
  }

  // Fork: PlayPort-style HEVC codec probing.
  // Tries multiple codec strings from most specific to least specific and each
  // hardware preference (Chromium only exposes HEVC through platform decoders),
  // using VideoDecoder.isConfigSupported to find one that works.
  async function probeHevcCodec(hvcC){
    var candidates=[];
    if(hvcC.length>=13){
      var profileSpace=['','A','B','C'][(hvcC[1]>>6)&0x03]||'';
      var tier=((hvcC[1]&0x20)!==0)?'H':'L';
      var profileIdc=hvcC[1]&0x1F;
      var compat=((hvcC[2]<<24)|(hvcC[3]<<16)|(hvcC[4]<<8)|hvcC[5])>>>0;
      // Bit-reverse for WebCodecs (ISO/IEC 14496-15)
      var rev=0, v=compat;
      for(var i=0;i<32;i++){ rev=((rev<<1)|(v&1))>>>0; v>>>=1; }
      var levelIdc=hvcC[12];
      var base='hvc1.'+profileSpace+profileIdc+'.'+rev.toString(16)+'.'+tier+levelIdc;
      candidates.push(base);
    }
    // Fallbacks (PlayPort-style)
    candidates.push('hvc1.1.6.L120.B0');
    candidates.push('hvc1.1.6.L93.B0');
    for(var c of candidates){
      for(var a of ['prefer-hardware', null, 'prefer-software']){
        try{
          var cfg={codec:c, description:hvcC};
          if(a) cfg.hardwareAcceleration=a;
          var support=await VideoDecoder.isConfigSupported(cfg);
          if(support&&support.supported) return {codec:c, accel:a};
        }catch(e){}
      }
    }
    return null;
  }

  async function configureDecoder(cfg){
    // Fork: cfg={vps,sps,pps} for HEVC, {sps,pps} for H.264
    // PlayPort-style: probe HEVC, use raw config as description
    // Debounce: the phone repeats in-band parameter sets; reconfiguring on each
    // one flushed the decoder AND spammed a keyframe request per repeat, which
    // fed the forceKeyFrame storm that stalled sessions.
    var cfgKey=(cfg.vps?'H':'A')+':'+(cfg.vps?cfg.vps.length:0)+':'+cfg.sps.length+':'+cfg.pps.length;
    if(decoderConfigured && cfgKey===lastConfiguredKey) return;
    lastConfiguredKey=cfgKey;
    if(cfg.vps){
      var hvcC=buildHvcC(cfg.vps,cfg.sps,cfg.pps);
      var best=await probeHevcCodec(hvcC);
      if(!best){
        decoderConfigured=false;
        var w=document.getElementById('waiting');
        if(w&&!imgShown){
          w.innerHTML='此浏览器不支持 H.265 (HEVC) 硬件解码<br>'+
            '请改用支持 HEVC 的浏览器(Chrome/Edge 107+ 或 Safari 17+)<br>'+
            '或在 Mac 本机打开本页面';
        }
        return;
      }
      try{
        var dcfg={codec:best.codec, description:hvcC, optimizeForLatency:true};
        if(best.accel) dcfg.hardwareAcceleration=best.accel;
        videoDecoder.configure(dcfg);
        decoderConfigured=true; sawKeyAfterConfig=false; auBuf=[];
        // Fork: watchdog - request keyframe if no frames decoded in 2.5s
        armKeyframeWatchdog();
        if(wsReady) send({t:'keyframe'}); // WebCodecs needs a key chunk first
      }catch(e){ 
        decoderConfigured=false; 
        var w=document.getElementById('waiting');
        if(w) w.innerHTML='解码器配置失败: '+(e&&e.message?e.message:e)+'<br>codec='+best.codec;
      }
    }else{
      var codec=codecStringFromSps(cfg.sps);
      var desc=buildAvcC(cfg.sps,cfg.pps);
      try{
        videoDecoder.configure({ codec:codec, description:desc, optimizeForLatency:true });
        decoderConfigured=true; sawKeyAfterConfig=false; auBuf=[];
        armKeyframeWatchdog();
        if(wsReady) send({t:'keyframe'});
      }catch(e){ decoderConfigured=false; }
    }
  }

  // Fork: PlayPort-style keyframe watchdog with WheelPlay dual-signal health.
  // The server pushes {t:'video',frames:N} every 2s counting NALs it actually
  // forwarded. A keyframe is requested ONLY when the source is still advancing
  // but nothing decodes — on a static CarPlay screen (or a genuinely stalled
  // uplink) the watchdog stays silent, so a throttled link is never pummeled by
  // forceKeyFrame I-frames (each one is a congestion collapse). After 3
  // consecutive silent requests the decoder is rebuilt (self-heal without page
  // reload); the backoff caps at 10s.
  var keyframeWatchdog=null, framesDecodedSinceConfig=0, keyframeBackoffMs=2500, lastConfiguredKey=null;
  var serverVideoFrames=-1, serverFramesAtArm=-2, stalledRequests=0;
  function armKeyframeWatchdog(){
    clearKeyframeWatchdog();
    framesDecodedSinceConfig=0;
    serverFramesAtArm=serverVideoFrames;
    keyframeWatchdog=setTimeout(function(){
      var sourceAdvancing = serverVideoFrames<0 || serverVideoFrames!==serverFramesAtArm;
      if(framesDecodedSinceConfig===0 && decoderConfigured && sourceAdvancing){
        // Request keyframe via WebSocket
        if(wsReady) send({t:'keyframe'});
        keyframeBackoffMs=Math.min(keyframeBackoffMs*2,10000);
        stalledRequests++;
        if(stalledRequests>=3){
          // Decoder is probably wedged (fatal decode errors can be silent):
          // rebuild it; the next config NALs reconfigure automatically.
          stalledRequests=0; keyframeBackoffMs=2500;
          decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[];
          try{ videoDecoder.close(); }catch(e){}
          setTimeout(makeDecoder,300);
        }else{
          armKeyframeWatchdog(); // Re-arm with the longer interval
        }
      }else if(framesDecodedSinceConfig>0){
        stalledRequests=0;
      }else{
        armKeyframeWatchdog(); // source static or not configured: keep waiting quietly
      }
    }, keyframeBackoffMs);
  }
  function clearKeyframeWatchdog(){
    if(keyframeWatchdog){ clearTimeout(keyframeWatchdog); keyframeWatchdog=null; }
  }
  // Call this when a frame is successfully decoded
  function onFrameDecoded(){ framesDecodedSinceConfig++; keyframeBackoffMs=2500; stalledRequests=0; }

  function buildHvcC(vps, sps, pps){
    // hvcC record assembled from the stream's parameter sets. The general
    // profile/tier/level is copied verbatim from the SPS (2-byte NAL header,
    // 1 byte vpsId/sublayers/nesting, then 12 bytes of general PTL) so the
    // record matches what the phone actually encodes.
    var vlen=vps.length, slen=sps.length, plen=pps.length;
    var len=23+3+2+vlen+3+2+slen+3+2+plen;
    var out=new Uint8Array(len), o=0;
    out[o++]=1; // configurationVersion
    if(sps.length>=15){
      out.set(sps.subarray(3,15),o); o+=12; // profile, compat, constraints, level
    }else{
      // general_profile_space(0)+tier(0)+profile_idc(1=Main)
      out[o++]=1; out[o++]=0x60; out[o++]=0; out[o++]=0; out[o++]=0;
      for(var i=0;i<6;i++) out[o++]=0; // constraint flags
      out[o++]=93; // level_idc
    }
    out[o++]=0xF0; out[o++]=0; // min_spatial_segmentation
    out[o++]=0xFC; // parallelismType
    out[o++]=0xFD; // chromaFormat = 1 (4:2:0)
    out[o++]=0xF8; // bitDepthLumaMinus8 = 0
    out[o++]=0xF8; // bitDepthChromaMinus8 = 0
    out[o++]=0; out[o++]=0; // avgFrameRate
    out[o++]=0x03; // constFramerate/numLayers/nested/lengthSize
    out[o++]=3; // numOfArrays
    // VPS array (type 32)
    out[o++]=0xA0; out[o++]=0; out[o++]=1;
    out[o++]=(vlen>>8)&0xFF; out[o++]=vlen&0xFF; out.set(vps,o); o+=vlen;
    // SPS array (type 33)
    out[o++]=0xA1; out[o++]=0; out[o++]=1;
    out[o++]=(slen>>8)&0xFF; out[o++]=slen&0xFF; out.set(sps,o); o+=slen;
    // PPS array (type 34)
    out[o++]=0xA2; out[o++]=0; out[o++]=1;
    out[o++]=(plen>>8)&0xFF; out[o++]=plen&0xFF; out.set(pps,o);
    return out;
  }

  /* Fork: access-unit assembly. WebCodecs wants one EncodedVideoChunk per
     picture (all slices plus leading SEI, length-prefixed); feeding one chunk
     per NAL never yields a frame. NALs buffer here until the next picture's
     first slice (or an AUD) closes the unit. */
  var auBuf=[], auHasKey=false, auPendingSince=0, sawKeyAfterConfig=false;
  function nalType(nal){
    if(videoCodec==='h265') return nal.length>=2?((nal[0]>>1)&0x3F):-1;
    return nal.length>=1?(nal[0]&0x1F):-1;
  }
  function isKeyType(t){
    // HEVC IRAP (IDR/BLA/CRA) = 16..23; H.264 IDR = 5
    return videoCodec==='h265' ? (t>=16&&t<=23) : t===5;
  }
  function isFirstSlice(nal,t){
    // slice payload opens with first_slice_segment_in_pic_flag (HEVC) /
    // first_mb_in_slice==0 (H.264), both encoded as a set high bit
    if(videoCodec==='h265') return t>=0&&t<32 && nal.length>=3 && (nal[2]&0x80)!==0;
    return t>=1&&t<=5 && nal.length>=2 && (nal[1]&0x80)!==0;
  }
  function sameBytes(a,b){
    if(a.length!==b.length) return false;
    for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }
  function cacheParam(kind,nal){
    spsPps=spsPps||{};
    if(spsPps[kind]&&sameBytes(spsPps[kind],nal)) return;
    spsPps[kind]=nal;
    if(decoderConfigured) decoderConfigured=false; // params changed: reconfigure
  }
  function flushAu(){
    if(!auBuf.length) return;
    var use=auBuf, key=auHasKey;
    auBuf=[]; auHasKey=false;
    if(!decoderConfigured||!videoDecoder||videoDecoder.state==='closed') return;
    if(!sawKeyAfterConfig&&!key) return; // first chunk after configure must be a key
    if(key) sawKeyAfterConfig=true;
    if(videoDecoder.decodeQueueSize>24&&!key){ return; } // falling behind: drop deltas
    var total=0,i;
    for(i=0;i<use.length;i++) total+=4+use[i].length;
    var chunk=new Uint8Array(total),o=0;
    for(i=0;i<use.length;i++){
      chunk[o]=(use[i].length>>>24)&0xFF; chunk[o+1]=(use[i].length>>>16)&0xFF;
      chunk[o+2]=(use[i].length>>>8)&0xFF; chunk[o+3]=use[i].length&0xFF;
      chunk.set(use[i],o+4); o+=4+use[i].length;
    }
    try{
      videoDecoder.decode(new EncodedVideoChunk({
        type:key?'key':'delta', timestamp:ts, data:chunk }));
      ts+=33333;
    }catch(e){}
  }
  function feedNal(nal){
    var t=nalType(nal);
    if(window._debugNal!==t){ window._debugNal=t; console.log('[NAL] type='+t+' codec='+videoCodec); }
    if(videoCodec==='h265'){
      if(t===32){ cacheParam('vps',nal); return; }
      if(t===33){ cacheParam('sps',nal); return; }
      if(t===34){ cacheParam('pps',nal); return; }
      if(t===35){ flushAu(); return; } // AUD delimits pictures
    }else{
      if(t===7){ cacheParam('sps',nal); return; }
      if(t===8){ cacheParam('pps',nal); return; }
      if(t===9){ flushAu(); return; } // AUD
    }
    if(t<0) return;
    if(isFirstSlice(nal,t)&&auBuf.length) flushAu();
    if(!auBuf.length){ auHasKey=false; auPendingSince=Date.now(); }
    if(isKeyType(t)) auHasKey=true;
    auBuf.push(nal);
  }

  var videoCodec='h264', ts=0; // codec set from server's first text message
  var videoAttempts=0;

  // Spec (2026-10-15 round 2): decode-paced drawing makes recovery look like
  // fast-forward. Keep only the newest frame and paint on rAF instead.
  var pendingFrame=null, renderQueued=false;
  function dropPendingFrame(){ if(pendingFrame){ try{pendingFrame.close();}catch(e){} pendingFrame=null; } }
  function renderLoop(){
    renderQueued=false;
    if(!ctx2d) return;
    var frame=pendingFrame; if(!frame) return;
    pendingFrame=null;
    if(canvas.width!==frame.displayWidth||canvas.height!==frame.displayHeight){
      canvas.width=frame.displayWidth; canvas.height=frame.displayHeight;
    }
    ctx2d.drawImage(frame,0,0); frame.close();
    if(!imgShown){ imgShown=true; waiting.style.display='none'; }
  }

  function makeDecoder(){
    videoDecoder=new VideoDecoder({
      output:function(frame){
        if(pendingFrame){ droppedFrames++; dropPendingFrame(); }
        pendingFrame=frame;
        if(!renderQueued){ renderQueued=true; requestAnimationFrame(renderLoop); }
        frameCount++;
        onFrameDecoded(); // Fork: PlayPort-style keyframe watchdog
      },
      error:function(e){
        // Fork: recreate the decoder; a fatal error closes it for good
        var w=document.getElementById('waiting');
        if(w&&!imgShown) w.innerHTML='解码器错误: '+(e&&e.message?e.message:e)+'<br>正在重建解码器…';
        decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[];
        try{ videoDecoder.close(); }catch(err){}
        setTimeout(function(){ makeDecoder(); }, 300);
      }
    });
  }

  function startWebCodecs(){
    canvas.style.display='block'; img.style.display='none';
    ctx2d=canvas.getContext('2d');
    decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[];
    dropPendingFrame();
    makeDecoder();
    var proto=location.protocol==='https:'?'wss':'ws';
    h264ws=new WebSocket(proto+'://'+location.host+'/h264');
    h264ws.binaryType='arraybuffer';
    h264ws.onopen=function(){ videoAttempts=0; };
    // Fork: poll /health for codec changes (server doesn't push to existing clients)
    setInterval(function(){
      try{
        var xhr=new XMLHttpRequest();
        xhr.open('GET','/health',true);
        xhr.onload=function(){
          if(xhr.status===200){
            try{
              var h=JSON.parse(xhr.responseText);
              if(h.codec&&h.codec!==videoCodec){
                console.log('[codec] changed via /health: '+videoCodec+' -> '+h.codec);
                videoCodec=h.codec;
                spsPps=null; decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[]; dropPendingFrame();
                try{ videoDecoder.close(); }catch(e){}
                makeDecoder();
              }
            }catch(e){}
          }
        };
        xhr.send();
      }catch(e){}
    }, 2000);
    h264ws.onmessage=function(ev){
      // Fork: first message is JSON with codec info
      if(typeof ev.data==='string'){
        try{
          var msg=JSON.parse(ev.data);
          if(msg.t==='video'&&typeof msg.frames==='number'){ serverVideoFrames=msg.frames; return; }
          if(msg.codec&&msg.codec!==videoCodec){
            videoCodec=msg.codec;
            // a different stream needs a fresh decoder
            spsPps=null; decoderConfigured=false; sawKeyAfterConfig=false; auBuf=[]; dropPendingFrame();
            try{ videoDecoder.close(); }catch(e){}
            makeDecoder();
          }
        }catch(e){}
        return;
      }
      var data=new Uint8Array(ev.data); bytesCount+=data.length;
      var units=parseNalUnits(data);
      for(var i=0;i<units.length;i++) feedNal(units[i]);
      // Old server format: each message is a complete frame, flush immediately
      // (don't wait 150ms for auBuf)
      if(auBuf.length) flushAu();
      var hasConfig = videoCodec==='h265' ?
        (spsPps&&spsPps.vps&&spsPps.sps&&spsPps.pps) :
        (spsPps&&spsPps.sps&&spsPps.pps);
      if(!decoderConfigured&&hasConfig){
        try { configureDecoder(spsPps); }
        catch(cfgErr){
          var we=document.getElementById('waiting');
          if(we) we.innerHTML='配置解码器失败: '+cfgErr.message;
        }
      }
      // Fork: debug - show received NAL stats on waiting overlay
      var w=document.getElementById('waiting');
      if(w&&!imgShown){
        var cfgStr = videoCodec==='h265' ?
          'VPS:'+(spsPps&&spsPps.vps?'✓':'✗')+' SPS:'+(spsPps&&spsPps.sps?'✓':'✗')+' PPS:'+(spsPps&&spsPps.pps?'✓':'✗') :
          'SPS:'+(spsPps&&spsPps.sps?'✓':'✗')+' PPS:'+(spsPps&&spsPps.pps?'✓':'✗');
        w.innerHTML='['+videoCodec+'] 收到 NAL: '+units.length+'个/包<br>'+
          cfgStr+
          '<br>解码器:'+(decoderConfigured?'已配置':'未配置')+
          '<br>已解码帧:'+frameCount;
      }
      updateHud('WebCodecs '+(videoCodec==='h265'?'H.265':'H.264'));
    };
    h264ws.onclose=function(){ videoAttempts++; var delay=Math.min(10000,2000*videoAttempts*videoAttempts); setTimeout(startWebCodecs,delay); };
    h264ws.onerror=function(){ try{h264ws.close();}catch(e){} };
  }

  function startMjpeg(){
    img.style.display='block'; canvas.style.display='none';
    img.src='/mjpeg?'+Date.now();
    img.addEventListener('error',function(){
      imgShown=false; waiting.style.display='flex';
      setTimeout(function(){ img.src='/mjpeg?'+Date.now(); },2000);
    });
    img.addEventListener('load',function(){ frameCount++; });
    setInterval(function(){ updateHud('MJPEG'); },1000);
  }

  /* ============ WebRTC direct passthrough (H.264, LAN host candidates) ============ */
  function rtcDegrade(reason){
    if(!rtcpc&&!rtcws) return;
    try{ sessionStorage.setItem('rtcBlocked','1'); }catch(e){}

  // per device in localStorage; default 200mm = the protocol's known-good

  var mmSel=document.getElementById('mmsel'), mmHint=document.getElementById('mmhint');
  function getWidthMm(){
    var v=parseInt(localStorage.getItem('niomm')||'200',10);
    return (v>=100&&v<=400)?v:200;
  }
  (function(){
    var cur=getWidthMm();
    for(var mm=100;mm<=400;mm+=25){
      var o=document.createElement('option');
      o.value=String(mm); o.textContent=mm+' mm'+(mm===200?'（默认）':'');
      if(mm===cur)o.selected=true;
      mmSel.appendChild(o);
    }
    mmSel.addEventListener('change',function(){
      try{ localStorage.setItem('niomm',mmSel.value); }catch(e){}
      var d=null;
      try{ d=JSON.parse(localStorage.getItem('nioDisplay')||'null'); }catch(e){}
      send({t:'display', width:(d&&d.w)||1920, height:(d&&d.h)||1080, matchWindow:true, widthMm:parseInt(mmSel.value,10)});

  // Rainbow-filled sliders (visual only; logic handlers untouched)
  function paintRange(el){
    var min=+el.min||0, max=+el.max||100, v=+el.value;

    el.style.background='linear-gradient(90deg,#ff5f6d,#ffb26b,#ffe66b,#6bd47f,#4fc3f7,#b06bf5 '+p+'%,var(--track) '+p+'%)';

        {src:'data:image/png;base64,'+icon192,sizes:'192x192',type:'image/png',purpose:'any'},
        {src:'data:image/png;base64,'+icon512,sizes:'512x512',type:'image/png',purpose:'any maskable'}
      ]
    };
    try{
      var link=document.createElement('link');
      link.rel='manifest';
      link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
      document.head.appendChild(link);
    }catch(e){}
  })();
})();
</script>
